name: Redeploy portfolio

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/KaiPereira/portfolio/dispatches \
            -d '{"event_type":"readme-updated"}'
